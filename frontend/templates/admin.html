<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Sales Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=4.0">
  <link rel="stylesheet" href="css/base.css?v=4.0">
  <link rel="stylesheet" href="css/shell.css?v=4.0">
  <link rel="stylesheet" href="css/digest.css?v=4.0">
  <link rel="stylesheet" href="css/account-detail.css?v=4.0">
  <link rel="stylesheet" href="css/sections-and-workflow.css?v=4.0">
  <link rel="stylesheet" href="css/people-drawer.css?v=4.0">
  <link rel="stylesheet" href="css/profile-page.css?v=4.0">
  <link rel="stylesheet" href="css/responsive.css?v=4.0">
  <link rel="stylesheet" href="css/admin-page.css?v=4.0">
  <link rel="stylesheet" href="css/crm-extras.css?v=1.0">
</head>

<body class="admin-page-body">

  <header class="dash-topbar">
    <div class="topbar-brand">
      <div class="topbar-icon" style="background: linear-gradient(135deg, var(--brand), #4f46e5);"><i
          class="fa-solid fa-shield-halved"></i></div>
      <div>
        <div class="topbar-title">Sales Intelligence Command</div>
        <div class="topbar-sub">Super Admin Management Console</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="topbar-dropdown" id="topbarAccountsDropdown">
        <button type="button" class="topbar-link topbar-dropdown-btn" id="globalAccountsBtn" title="View organization accounts">
          <i class="fa-solid fa-city"></i>
          <span>Global Accounts</span>
          <i class="fa-solid fa-chevron-down dropdown-chevron"></i>
        </button>
        <div class="topbar-dropdown-menu d-none" id="globalAccountsMenu">
          <div class="dropdown-menu-header">
            <span class="dropdown-header-title"><i class="fa-solid fa-city"></i> Organisation Accounts</span>
            <span class="dropdown-header-badge" id="dropdownAccountCount">...</span>
          </div>
          <div class="dropdown-menu-list" id="dropdownAccountList">
            <div class="dropdown-loading"><div class="spinner-sm"></div> Loading accounts…</div>
          </div>
        </div>
      </div>
      <a href="/pipline/" class="topbar-link"><i class="fa-solid fa-compass"></i> Pipeline Explorer <i
          class="fa-solid fa-arrow-up-right-from-square"></i></a>
      <span id="topbarAuthUser" class="topbar-auth-user"></span>
      <button type="button" class="topbar-link topbar-link-btn" id="adminLogoutBtn" title="Sign out"><i
          class="fa-solid fa-right-from-bracket"></i> Logout</button>
      <button id="themeToggle" class="topbar-theme-btn" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <main class="admin-main" id="adminMain">
    <div class="admin-page-loading">
      <div class="spinner-md"></div>
      <span>Loading Admin Command Center…</span>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/modules/admin-page.js?v=4.2"></script>
</body>

</html>
