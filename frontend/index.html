<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Intelligence Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-shell">

  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">📡</div>
      <div class="brand-text">
        <div class="brand-name">Sales Intel</div>
        <div class="brand-sub">Account Explorer</div>
      </div>
      <button class="theme-btn" id="themeToggle" title="Toggle theme" style="margin-left: auto; width: 32px; height: 32px; font-size: .9rem; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.12); color: #fff;">🌙</button>
    </div>

    <!-- Replicated Search & Action Buttons from original -->
    <div class="sidebar-search">
      <input type="text" id="accountSearch" placeholder="Search accounts..." autocomplete="off" name="presentation" data-lpignore="true">
    </div>

    <button type="button" class="run-pipeline-nav" id="runPipelineNav">▶&nbsp;&nbsp;Run Pipeline</button>
    <button type="button" class="run-pipeline-nav api-docs-nav" id="apiDocsNav">📖&nbsp;&nbsp;API Docs</button>

    <div class="sidebar-label">Accounts</div>

    <div class="account-list" id="accountList">
      <!-- Accounts will be injected here via JS -->
      <div class="spinner-wrap"><div class="spinner"></div></div>
    </div>

    <div class="sidebar-footer">
      Connected to NeonDB
    </div>
  </aside>

  <!-- ── Main Content ────────────────────────────────────────── -->
  <div class="content">

    <div class="main-pad">

      <!-- Empty state -->
      <div id="emptyState" class="empty-state fade-in">
        <div class="empty-icon">🏢</div>
        <p class="empty-title">No account selected</p>
        <p class="empty-sub">Choose an enterprise account from the sidebar to explore its organizational hierarchy and personas.</p>
      </div>

      <!-- Main Dashboard Container (Visible when account is clicked) -->
      <div id="dashboardContainer" class="d-none">
        
        <!-- Account Hero Header -->
        <div class="account-hero fade-in">
          <div class="hero-avatar" id="heroAvatar"></div>
          <div class="hero-info">
            <h1 class="hero-name" id="accountName"></h1>
            <div class="hero-meta">
              <span class="pill pill-brand" id="accountTicker"></span>
              <span class="pill" id="accountRevenue"></span>
              <span class="pill pill-success" id="accountLocation"></span>
            </div>
            <p class="account-desc" id="accountDesc"></p>
          </div>
          <div class="hero-actions d-none">
            <!-- Drill Down Button for Account -> LOBs (Removed for Tabs) -->
          </div>
        </div>

        <!-- Section 1: Lines of Business (LOB Cards) -->
        <div id="lobSection" class="mt-4 d-none">
          <div class="section-header">
            <span>📁 Lines of Business (LOB)</span>
            <span class="text-muted" style="font-size: .75rem; font-weight: normal;" id="lobCountBadge"></span>
          </div>
          <div class="compact-card-grid" id="lobCardsContainer"></div>
        </div>

        <!-- Section 2: Personas / Hierarchy Cards (Visible after LOB click) -->
        <div id="personaSection" class="mt-4 d-none">
          <div class="section-header">
            <span id="personaSectionTitle">👥 Organizational Hierarchy & Contacts</span>
            <span class="text-muted" style="font-size: .75rem; font-weight: normal;" id="personaCountBadge"></span>
          </div>
          <div class="compact-card-grid" id="personaCardsContainer"></div>
        </div>

        <!-- Section 3: Categorized Detail Panel & Action Center (LOB or Persona) -->
        <div id="detailPanelContainer" class="d-none"></div>

      </div>

    </div><!-- /main-pad -->
  </div><!-- /content -->
</div><!-- /app-shell -->

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
