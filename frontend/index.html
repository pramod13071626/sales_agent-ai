<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Intelligence Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="dash-shell">

  <header class="dash-topbar">
    <div class="topbar-brand">
      <div class="topbar-icon"><i class="bi bi-diagram-3"></i></div>
      <div>
        <div class="topbar-title">Sales Intelligence Dashboard</div>
        <div class="topbar-sub">Account Command Center</div>
      </div>
    </div>
    <div class="topbar-actions">
      <a href="/pipline/" class="topbar-link">Account Explorer <i class="bi bi-box-arrow-up-right"></i></a>
      <button id="themeToggle" class="topbar-theme-btn" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
    </div>
  </header>

  <div class="dash-body">

    <!-- ── Left Column — Account Navigator ─────────────────────── -->
    <aside class="dash-nav">
      <div class="nav-search">
        <input id="navSearch" type="text" placeholder="Search accounts..." autocomplete="off">
      </div>

      <div class="nav-filters" id="navFilters"><!-- filter chips injected --></div>

      <div class="nav-section-label">Accounts</div>
      <div class="nav-tree" id="navTree">
        <div class="nav-loading">Loading accounts…</div>
      </div>
    </aside>

    <!-- ── Center Column — Account Intelligence ────────────────── -->
    <main class="dash-main">
      <div class="dash-empty" id="dashEmpty"></div>
      <div class="dash-content d-none" id="dashContent"></div>
    </main>

    <!-- ── Right Column — People & Social ──────────────────────── -->
    <aside class="dash-people" id="dashPeople">
      <div class="people-empty">Select an account to see key contacts, social presence, and tech stack.</div>
    </aside>

  </div>
</div>

<div class="toast" id="toast"></div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="contact-drawer" id="contactDrawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawerTitle">Contact</div>
    <button type="button" class="drawer-close" id="drawerClose" title="Close"><i class="bi bi-x-lg"></i></button>
  </div>
  <div class="drawer-pinned" id="drawerPinned"></div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="js/dashboard.js"></script>
</body>
</html>
