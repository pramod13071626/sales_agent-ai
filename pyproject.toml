[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "sales_agent-ai",   # committed venv artifacts, never lint/format these
    "output",
    "apps/content_pipeline/output",
]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core, I: import sorting, B: bugbear (common bug patterns),
# UP: pyupgrade, S: bandit-equivalent security checks, C4: comprehension cleanups.
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = [
    "S101",  # assert is fine in test files
    "E501",  # long lines already covered by line-length + formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"apps/content_pipeline/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["sales_agent-ai", "output", "apps/content_pipeline/output"]
# No project code has type hints yet; this starts as a report-only signal
# in CI (see .github/workflows/code-quality.yml) rather than a hard gate.
check_untyped_defs = false

[tool.coverage.run]
branch = true
omit = [
    "sales_agent-ai/*",
    "*/tests/*",
    "*/output/*",
]

[tool.coverage.report]
skip_empty = true
