name: Code Quality

on:
  pull_request:
  push:
    branches: [feature/sales-intelligence-pipeline]

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Both lint jobs below only fail a PR on lines it actually changes
  # (reviewdog's `-filter-mode=added`). The existing codebase has ~300
  # pre-existing pylint/flake8/bandit findings, 67 unformatted Python
  # files, and a couple of dozen pre-existing frontend lint issues —
  # nobody should be blocked fixing those just to land an unrelated
  # change. New/changed code is held to the real bar from day one; the
  # backlog shrinks incrementally as those files get touched anyway.
  #
  # Filtering here is file-level, computed with plain `git diff
  # --name-only` against the PR's base branch (fetched explicitly
  # below) — NOT reviewdog's own diff/filter-mode machinery. Two
  # different reviewdog diff strategies (-reporter=github-pr-check's
  # GitHub-side service, then a self-supplied -diff="git diff
  # FETCH_HEAD...HEAD" fed to -reporter=local) both silently reported
  # on the entire repo, unfiltered, in real runs — not reproducible or
  # debuggable from outside a live run. A plain `git diff --name-only`
  # was verified directly against the real pushed branches before
  # relying on it here. This is coarser than line-level filtering (a
  # PR touching one line of a file re-flags that whole file's existing
  # issues), but it is actually correct, which the line-level attempts
  # were not.
  python-quality:
    name: Python Lint & Security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling + app dependencies
        run: |
          pip install flake8 "pylint>=3.0" black "bandit[toml]"
          pip install -r requirements.txt
          pip install -r apps/content_pipeline/requirements.txt

      # For a pull_request event, actions/checkout puts us on GitHub's
      # synthetic merge commit (base tip + PR head merged together), which
      # has exactly two parents: HEAD^1 is the base branch's tip AT THE
      # MOMENT that merge commit was generated, HEAD^2 is the PR branch's
      # own head. That's the correct, race-free base to diff against.
      #
      # A prior version of this workflow instead ran `git fetch origin
      # <base-ref>` and diffed against that fresh fetch. That's wrong
      # whenever the base branch has moved since the merge commit was
      # generated (confirmed happening here: the base branch advanced with
      # a commit that itself touched serializers/*, and the freshly-fetched
      # tip no longer shared a recent merge-base with the stale merge
      # commit — triple-dot diff fell back to a much older common ancestor
      # and pulled in everything the base had changed independently since
      # then). HEAD^1 has no such staleness window: it's read directly out
      # of the commit that's already checked out, not re-fetched.
      - name: Determine changed Python files
        id: changed
        run: |
          echo "HEAD    -> $(git rev-parse HEAD) ($(git log -1 --format=%s HEAD))"
          echo "HEAD^1  -> $(git rev-parse HEAD^1) ($(git log -1 --format=%s HEAD^1))"
          git diff --name-only --diff-filter=ACMR HEAD^1...HEAD -- '*.py' \
            | grep -v '^sales_agent-ai/' > changed_py_files.txt || true
          echo "Changed Python files ($(wc -l < changed_py_files.txt)):"
          cat changed_py_files.txt

      # Every step below re-prints the file count + list it's about to lint
      # (not just the step above) so that whichever single step's log gets
      # captured/shared is self-diagnosing on its own.
      - name: flake8
        run: |
          echo "Linting $(wc -l < changed_py_files.txt) file(s):"; cat changed_py_files.txt
          [ -s changed_py_files.txt ] || { echo "No changed Python files."; exit 0; }
          xargs flake8 < changed_py_files.txt

      - name: pylint
        run: |
          echo "Linting $(wc -l < changed_py_files.txt) file(s):"; cat changed_py_files.txt
          [ -s changed_py_files.txt ] || { echo "No changed Python files."; exit 0; }
          xargs pylint --output-format=text < changed_py_files.txt

      - name: black --check
        run: |
          echo "Linting $(wc -l < changed_py_files.txt) file(s):"; cat changed_py_files.txt
          [ -s changed_py_files.txt ] || { echo "No changed Python files."; exit 0; }
          xargs black --check --diff < changed_py_files.txt

      - name: bandit
        run: |
          echo "Linting $(wc -l < changed_py_files.txt) file(s):"; cat changed_py_files.txt
          [ -s changed_py_files.txt ] || { echo "No changed Python files."; exit 0; }
          xargs bandit -c pyproject.toml < changed_py_files.txt

  frontend-quality:
    name: Frontend Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      # See the long comment in python-quality's "Determine changed Python
      # files" step: HEAD^1 (the merge commit's base-branch parent) is the
      # correct, race-free diff target — not a freshly re-fetched base ref.
      - name: Determine changed frontend files
        run: |
          echo "HEAD    -> $(git rev-parse HEAD) ($(git log -1 --format=%s HEAD))"
          echo "HEAD^1  -> $(git rev-parse HEAD^1) ($(git log -1 --format=%s HEAD^1))"
          git diff --name-only --diff-filter=ACMR HEAD^1...HEAD -- 'frontend/*.js' 'apps/content_pipeline/frontend/*.js' \
            | grep -v '^sales_agent-ai/' > changed_js_files.txt || true
          git diff --name-only --diff-filter=ACMR HEAD^1...HEAD -- '*.html' \
            | grep -v '^sales_agent-ai/' > changed_html_files.txt || true
          git diff --name-only --diff-filter=ACMR HEAD^1...HEAD -- '*.css' \
            | grep -v '^sales_agent-ai/' > changed_css_files.txt || true
          echo "Changed JS files ($(wc -l < changed_js_files.txt)):"; cat changed_js_files.txt
          echo "Changed HTML files ($(wc -l < changed_html_files.txt)):"; cat changed_html_files.txt
          echo "Changed CSS files ($(wc -l < changed_css_files.txt)):"; cat changed_css_files.txt

      - name: eslint (jQuery/vanilla JS)
        run: |
          echo "Linting $(wc -l < changed_js_files.txt) file(s):"; cat changed_js_files.txt
          [ -s changed_js_files.txt ] || { echo "No changed JS files."; exit 0; }
          xargs npx eslint < changed_js_files.txt

      - name: htmlhint
        run: |
          echo "Linting $(wc -l < changed_html_files.txt) file(s):"; cat changed_html_files.txt
          [ -s changed_html_files.txt ] || { echo "No changed HTML files."; exit 0; }
          xargs npx htmlhint < changed_html_files.txt

      - name: stylelint (Bootstrap overrides)
        run: |
          echo "Linting $(wc -l < changed_css_files.txt) file(s):"; cat changed_css_files.txt
          [ -s changed_css_files.txt ] || { echo "No changed CSS files."; exit 0; }
          xargs npx stylelint < changed_css_files.txt

  typecheck:
    name: Static type check (mypy, report-only)
    runs-on: ubuntu-latest
    # No project code has type hints yet, so mypy is wired in as a visible,
    # non-blocking signal. Flip this to a hard gate once coverage is real.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy pytest pytest-cov
          pip install -r requirements.txt
          pip install -r apps/content_pipeline/requirements.txt

      # Run per-app: both apps have same-named top-level modules (db, config,
      # main, paths, ...), so a single `mypy .` across both trees fails with
      # "Duplicate module named ..." before it checks anything.
      #
      # continue-on-error is set on *each* step, not just the job: the
      # job-level flag alone only stops a failed job from failing the
      # overall workflow — it does NOT make a failed step let the next
      # step run. Without this, mypy (sales_ai) failing (it does; ~78
      # pre-existing errors, no type hints in this codebase yet) would
      # abort the job before mypy (content_pipeline) ever ran.
      - name: mypy (sales_ai)
        continue-on-error: true
        run: mypy . --exclude 'apps/content_pipeline/'

      - name: mypy (content_pipeline)
        continue-on-error: true
        run: mypy apps/content_pipeline

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sales_ai
            working-directory: "."
            requirements: requirements.txt
          - name: content_pipeline
            working-directory: apps/content_pipeline
            requirements: apps/content_pipeline/requirements.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r ${{ matrix.requirements }}

      - name: Run tests with coverage
        working-directory: ${{ matrix.working-directory }}
        run: |
          python -m pytest tests/ \
            --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=0

      # No coverage floor yet (there's almost nothing to cover beyond the
      # smoke tests this branch adds) — raise --cov-fail-under above once
      # real unit tests exist, instead of leaving this check meaningless.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.working-directory }}/coverage.xml
