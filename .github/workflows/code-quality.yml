name: Code Quality

on:
  pull_request:
  push:
    branches: [feature/sales-intelligence-pipeline]

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Both lint jobs below only fail a PR on lines it actually changes
  # (reviewdog's `-filter-mode=added`). The existing codebase has ~300
  # pre-existing pylint/flake8/bandit findings, 67 unformatted Python
  # files, and a couple of dozen pre-existing frontend lint issues —
  # nobody should be blocked fixing those just to land an unrelated
  # change. New/changed code is held to the real bar from day one; the
  # backlog shrinks incrementally as those files get touched anyway.
  #
  # The diff used for that filtering is computed here with plain `git
  # diff` against the PR's base branch (fetched explicitly below), and
  # fed to reviewdog via `-diff`/`-reporter=local` — NOT via
  # `-reporter=github-pr-check`'s own GitHub-side diff service. That
  # service goes through GitHub's diff API (which 406s and falls back
  # to a git-based path for large diffs) or a "doghouse" relay,
  # neither of which is verifiable from outside a live run; a first
  # run showed every pre-existing finding in the whole repo, unfiltered
  # — i.e. the base-comparison silently wasn't applied. `-reporter=local`
  # only prints to the job log and relies on the job's own exit code to
  # fail the check, which is all a required-status-check gate actually
  # needs; it loses reviewdog's inline PR annotations, not the gate
  # itself.
  python-quality:
    name: Python Lint & Security
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tooling + app dependencies
        run: |
          pip install flake8 "pylint>=3.0" black "bandit[toml]"
          pip install -r requirements.txt
          pip install -r apps/content_pipeline/requirements.txt

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: flake8
        run: |
          set +e
          flake8 . > flake8-report.txt
          set -e
          cat flake8-report.txt | reviewdog -efm="%f:%l:%c: %m" -name="flake8" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

      - name: pylint
        run: |
          set +e
          pylint --output-format=text --msg-template='{path}:{line}:{column}: {msg_id} {msg}' \
            $(git ls-files '*.py' | grep -v '^sales_agent-ai/') > pylint-report.txt
          set -e
          cat pylint-report.txt | reviewdog -efm="%f:%l:%c: %m" -name="pylint" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

      - name: black --check
        run: |
          set +e
          black --check --diff . > black.diff 2>/dev/null
          set -e
          cat black.diff | reviewdog -f=diff -f.diff.strip=0 -name="black" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

      - name: bandit
        run: |
          set +e
          bandit -c pyproject.toml -r . -f custom \
            --msg-template '{relpath}:{line}: {test_id} {msg}' > bandit-report.txt
          set -e
          cat bandit-report.txt | reviewdog -efm="%f:%l: %m" -name="bandit" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

  frontend-quality:
    name: Frontend Lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: eslint (jQuery/vanilla JS, frontend/)
        run: |
          set +e
          npx eslint "frontend/**/*.js" -f compact > eslint-report.txt
          set -e
          cat eslint-report.txt | reviewdog -efm="%f: line %l, col %c, %m" -name="eslint" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

      - name: htmlhint
        run: |
          set +e
          npx htmlhint "frontend/**/*.html" "apps/content_pipeline/frontend/**/*.html" \
            --format=compact > htmlhint-report.txt
          set -e
          cat htmlhint-report.txt | reviewdog -efm="%f: line %l, col %c, %m" -name="htmlhint" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

      - name: stylelint (Bootstrap overrides)
        run: |
          set +e
          npx stylelint "frontend/**/*.css" --formatter compact > stylelint-report.txt
          set -e
          cat stylelint-report.txt | reviewdog -efm="%f: line %l, col %c, %m" -name="stylelint" \
            -reporter=local -diff="git diff FETCH_HEAD...HEAD" -filter-mode=added -fail-level=error

  typecheck:
    name: Static type check (mypy, report-only)
    runs-on: ubuntu-latest
    # No project code has type hints yet, so mypy is wired in as a visible,
    # non-blocking signal. Flip this to a hard gate once coverage is real.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy pytest pytest-cov
          pip install -r requirements.txt
          pip install -r apps/content_pipeline/requirements.txt

      # Run per-app: both apps have same-named top-level modules (db, config,
      # main, paths, ...), so a single `mypy .` across both trees fails with
      # "Duplicate module named ..." before it checks anything.
      #
      # continue-on-error is set on *each* step, not just the job: the
      # job-level flag alone only stops a failed job from failing the
      # overall workflow — it does NOT make a failed step let the next
      # step run. Without this, mypy (sales_ai) failing (it does; ~78
      # pre-existing errors, no type hints in this codebase yet) would
      # abort the job before mypy (content_pipeline) ever ran.
      - name: mypy (sales_ai)
        continue-on-error: true
        run: mypy . --exclude 'apps/content_pipeline/'

      - name: mypy (content_pipeline)
        continue-on-error: true
        run: mypy apps/content_pipeline

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sales_ai
            working-directory: "."
            requirements: requirements.txt
          - name: content_pipeline
            working-directory: apps/content_pipeline
            requirements: apps/content_pipeline/requirements.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov
          pip install -r ${{ matrix.requirements }}

      - name: Run tests with coverage
        working-directory: ${{ matrix.working-directory }}
        run: |
          python -m pytest tests/ \
            --cov=. --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=0

      # No coverage floor yet (there's almost nothing to cover beyond the
      # smoke tests this branch adds) — raise --cov-fail-under above once
      # real unit tests exist, instead of leaving this check meaningless.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.working-directory }}/coverage.xml
